openapi: 3.0.3

info:
  title: Dart REST API
  description: RESTful API built with Dart, Shelf and PostgreSQL.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:

  /:
    get:
      summary: API health check
      responses:
        '200':
          description: API is running

  /api/users:
    get:
      summary: Get all users
      tags:
        - Users
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

    post:
      summary: Create a user
      tags:
        - Users

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'

      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'

        '422':
          description: Validation error

  /api/users/{id}:
    get:
      summary: Get a user by ID
      tags:
        - Users

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1

      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

        '404':
          description: User not found

    put:
      summary: Update a user
      tags:
        - Users

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'

      responses:
        '200':
          description: User updated successfully

        '404':
          description: User not found

    delete:
      summary: Delete a user
      tags:
        - Users

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1

      responses:
        '200':
          description: User deleted successfully

        '404':
          description: User not found

components:

  schemas:

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: Seyha

        email:
          type: string
          format: email
          example: seyha@example.com

        created_at:
          type: string
          format: date-time
          example: 2026-08-15T09:00:00Z

    CreateUserRequest:
      type: object
      required:
        - name
        - email

      properties:
        name:
          type: string
          example: Seyha

        email:
          type: string
          format: email
          example: seyha@example.com